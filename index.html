<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transcript OCR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            width: min(1150px, calc(100% - 40px));
            margin: 0 auto;
            padding: 40px 0 60px;
        }

        /* =========================
           Header
        ========================= */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #777;
        }

        /* =========================
           Upload
        ========================= */

        .upload-box {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .drop-zone {
            border: 2px dashed #b8b8b8;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fafafa;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #333;
            background: #f0f0f0;
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .drop-title {
            font-size: 19px;
            font-weight: bold;
        }

        .drop-subtitle {
            margin-top: 8px;
            color: #666;
        }

        .file-type {
            margin-top: 10px;
            color: #999;
            font-size: 13px;
        }

        .selected-file {
            display: none;
            margin-top: 15px;
            padding: 14px;
            border-radius: 10px;
            background: #f3f3f3;
        }

        .selected-file-name {
            font-weight: bold;
        }

        .selected-file-size {
            margin-top: 4px;
            color: #777;
            font-size: 13px;
        }

        button {
            margin-top: 15px;
            padding: 11px 22px;
            border: none;
            border-radius: 9px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        /* =========================
           Loading
        ========================= */

        .loading-container {
            margin-top: 10px;
            width: 100%;
            max-width: 500px;
            height: 8px;
            background: #e5e5e5;
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            width: 40%;
            height: 100%;
            background: #333;
            animation: loading 1.2s infinite;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(250%);
            }
        }

        /* =========================
           Section
        ========================= */

        .section-title {
            margin: 30px 0 15px;
            font-size: 21px;
        }

        /* =========================
           Student Card
        ========================= */

        .student-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 22px;
        }

        .student-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .student-id {
            padding: 7px 12px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .info-item {
            padding: 15px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .label {
            font-size: 12px;
            color: #777;
        }

        .value {
            margin-top: 5px;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        /* =========================
           GPA Cards
        ========================= */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .summary-label {
            color: #777;
            font-size: 14px;
        }

        .summary-value {
            margin-top: 8px;
            font-size: 32px;
            font-weight: bold;
        }

        /* =========================
           Semester
        ========================= */

        .semester-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .semester-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .semester-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .semester-gpa {
            padding: 8px 13px;
            background: #f1f1f1;
            border-radius: 8px;
            font-weight: bold;
        }

        /* =========================
           Table
        ========================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e5e5;
            text-align: left;
        }

        th {
            background: #f5f5f5;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 850px) {

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .container {
                width: min(100% - 24px, 1150px);
                padding-top: 25px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .info-grid,
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .student-header,
            .semester-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .upload-box,
            .student-card,
            .summary-card,
            .semester-card {
                padding: 18px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- Header -->

    <div class="page-header">

        <h1>
            Transcript OCR
        </h1>

        <p>
            อัปโหลด Transcript เพื่อแปลงข้อมูลเป็นรูปแบบดิจิทัล
        </p>

    </div>


    <!-- Upload -->

    <div class="upload-box">

        <div
            class="drop-zone"
            id="dropZone"
        >

            <div class="upload-icon">
                📄
            </div>

            <div class="drop-title">
                ลากไฟล์ PDF มาวางที่นี่
            </div>

            <div class="drop-subtitle">
                หรือคลิกเพื่อเลือกไฟล์
            </div>

            <div class="file-type">
                รองรับไฟล์ .PDF
            </div>

            <input
                type="file"
                id="fileInput"
                accept=".pdf"
                hidden
            >

        </div>


        <div
            class="selected-file"
            id="selectedFile"
        >

            <div
                class="selected-file-name"
                id="selectedFileName"
            ></div>

            <div
                class="selected-file-size"
                id="selectedFileSize"
            ></div>

        </div>


        <button id="extractBtn">
            Extract Transcript
        </button>


        <div id="status"></div>

    </div>


    <!-- Result -->

    <div id="result"></div>

</div>


<script>

    const fileInput =
        document.getElementById("fileInput");

    const dropZone =
        document.getElementById("dropZone");

    const extractBtn =
        document.getElementById("extractBtn");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const selectedFile =
        document.getElementById("selectedFile");

    const selectedFileName =
        document.getElementById("selectedFileName");

    const selectedFileSize =
        document.getElementById("selectedFileSize");


    let selectedFileObject = null;


    /* =========================
       File Picker
    ========================= */

    dropZone.addEventListener(
        "click",
        () => {

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        () => {

            if (fileInput.files.length > 0) {

                setSelectedFile(
                    fileInput.files[0]
                );

            }

        }
    );


    /* =========================
       Drag & Drop
    ========================= */

    dropZone.addEventListener(
        "dragover",
        (event) => {

            event.preventDefault();

            dropZone.classList.add(
                "dragover"
            );

        }
    );


    dropZone.addEventListener(
        "dragleave",
        () => {

            dropZone.classList.remove(
                "dragover"
            );

        }
    );


    dropZone.addEventListener(
        "drop",
        (event) => {

            event.preventDefault();

            dropZone.classList.remove(
                "dragover"
            );


            const files =
                event.dataTransfer.files;


            if (!files.length) {
                return;
            }


            const file = files[0];


            if (
                file.type !==
                "application/pdf"
            ) {

                status.textContent =
                    "กรุณาเลือกไฟล์ PDF เท่านั้น";

                return;

            }


            setSelectedFile(file);

        }
    );


    /* =========================
       Selected File
    ========================= */

    function setSelectedFile(file) {

        selectedFileObject = file;

        selectedFile.style.display =
            "block";

        selectedFileName.textContent =
            file.name;

        selectedFileSize.textContent =
            formatFileSize(file.size);

        status.textContent =
            "เลือกไฟล์แล้ว";

        result.innerHTML = "";

    }


    function formatFileSize(bytes) {

        if (bytes < 1024) {
            return bytes + " Bytes";
        }

        if (bytes < 1024 * 1024) {
            return (
                bytes / 1024
            ).toFixed(1) + " KB";
        }

        return (
            bytes / (1024 * 1024)
        ).toFixed(1) + " MB";

    }


    /* =========================
       Extract
    ========================= */

    extractBtn.addEventListener(
        "click",
        async () => {

            const file =
                selectedFileObject;


            if (!file) {

                status.textContent =
                    "กรุณาเลือกไฟล์ PDF";

                return;

            }


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            status.innerHTML = `

                <div>
                    กำลังประมวลผล OCR...
                </div>

                <div class="loading-container">

                    <div class="loading-bar"></div>

                </div>

            `;


            result.innerHTML = "";

            extractBtn.disabled = true;


            try {

                const response =
                    await fetch(
                        "/api/transcript/upload",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json().catch(() => ({}));


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "เกิดข้อผิดพลาด"
                    );

                }


                status.textContent =
                    "OCR สำเร็จ";


                displayTranscript(
                    data.result
                );


            } catch (error) {

                status.textContent =
                    "ไม่สามารถประมวลผลไฟล์ได้";

                result.innerHTML = `

                    <div class="student-card">

                        ${error.message}

                    </div>

                `;

            } finally {

                extractBtn.disabled =
                    false;

            }

        }
    );


    /* =========================
       Display Transcript
    ========================= */

    function displayTranscript(data) {

        const header =
            data.header_detail;

        const transcript =
            data.transcript_detail;


        let html = "";


        /* Student */

        html += `

            <div class="section-title">
                ข้อมูลนักศึกษา
            </div>


            <div class="student-card">

                <div class="student-header">

                    <h2>
                        ${header.prename || ""}
                        ${header.name || ""}
                    </h2>

                    <div class="student-id">
                        รหัส:
                        ${header.student_id || "-"}
                    </div>

                </div>


                <div class="info-grid">


                    <div class="info-item">

                        <div class="label">
                            คณะ
                        </div>

                        <div class="value">
                            ${header.faculty_name || "-"}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="label">
                            สาขา
                        </div>

                        <div class="value">
                            ${header.major || "-"}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="label">
                            หลักสูตร
                        </div>

                        <div class="value">
                            ${header.program || "-"}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="label">
                            วันเกิด
                        </div>

                        <div class="value">
                            ${header.date_of_birth || "-"}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="label">
                            วันที่เข้าศึกษา
                        </div>

                        <div class="value">
                            ${header.admis_date || "-"}
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="label">
                            สถานะ
                        </div>

                        <div class="value">
                            ${header.grad_reason || "-"}
                        </div>

                    </div>


                </div>

            </div>

        `;


        /* Summary */

        html += `

            <div class="section-title">
                ผลการเรียนสะสม
            </div>


            <div class="summary-grid">


                <div class="summary-card">

                    <div class="summary-label">
                        หน่วยกิตสะสม
                    </div>

                    <div class="summary-value">
                        ${transcript.total_credits_earned ?? "-"}
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        Cumulative GPA
                    </div>

                    <div class="summary-value">
                        ${transcript.cumulative_gpa || "-"}
                    </div>

                </div>


            </div>

        `;


        /* Semesters */

        (transcript.semesters || []).forEach(
            semester => {

                html += `

                    <div class="semester-card">

                        <div class="semester-header">

                            <h2>
                                ภาคการศึกษา
                                ${semester.sem_num}/${semester.year}
                            </h2>

                            <div class="semester-gpa">
                                GPA:
                                ${semester.GPA || "-"}
                            </div>

                        </div>


                        <div class="table-wrapper">

                            <table>

                                <thead>

                                    <tr>

                                        <th>
                                            รหัสวิชา
                                        </th>

                                        <th>
                                            รายวิชา
                                        </th>

                                        <th>
                                            หน่วยกิต
                                        </th>

                                        <th>
                                            เกรด
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                `;


                semester.subject.forEach(
                    subject => {

                        html += `

                            <tr>

                                <td>
                                    ${subject.subject_id || "-"}
                                </td>

                                <td>
                                    ${subject.subject_name || "-"}
                                </td>

                                <td>
                                    ${subject.credit ?? "-"}
                                </td>

                                <td>
                                    ${subject.grade_earn || "-"}
                                </td>

                            </tr>

                        `;

                    }
                );


                html += `

                                </tbody>

                            </table>

                        </div>

                    </div>

                `;

            }
        );


        result.innerHTML =
    html + `

        <div style="
            text-align: center;
            margin: 30px 0;
        ">

            <button
                onclick="resetTranscript()"
                style="
                    background: #666;
                    padding: 11px 24px;
                "
            >
                เลือกไฟล์ใหม่
            </button>

        </div>

    `;

    }
    function resetTranscript() {

    selectedFileObject = null;

    fileInput.value = "";

    selectedFile.style.display = "none";

    selectedFileName.textContent = "";

    selectedFileSize.textContent = "";

    status.textContent = "";

    result.innerHTML = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

</script>

</body>

</html>
